<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
  <style>
    /* An artboard is a FIXED-SIZE frame, so content-box is the wrong default
       here: a root of width 1280 plus padding 46 measures 1372 and silently
       overflows the frame it is meant to fill. The Reaction thumbnail did
       exactly that — 1372x812 inside a 1280x720 frame — which an export would
       have cropped. Border-box also makes the editor's drag-and-resize behave
       the way somebody moving a box expects. */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #b6ff3a; } a:hover { color: #d6ff8a; }
    .display { font-family: "Bungee", "Arial Black", Impact, sans-serif; }
    .support { font-family: "Archivo", "Helvetica Neue", sans-serif; }
    /* THE OUTLINE IS THE WHOLE TRICK. A thumbnail is judged at about 210px
       wide in a feed and as little as 120px on a phone. White text on a busy
       game screenshot disappears at that size; a heavy dark stroke plus one
       hard drop shadow keeps every letter legible whatever is behind it.
       paint-order puts the stroke UNDER the fill so it thickens the letter
       outward instead of eating into it. */
    .punch {
      color: #ffffff;
      -webkit-text-stroke: 13px #05070d;
      paint-order: stroke fill;
      text-shadow: 0 10px 0 rgba(5, 7, 13, .95);
      letter-spacing: -.01em;
    }
    .shot {
      border: 6px dashed rgba(255,255,255,.35);
      border-radius: 18px;
      background: repeating-linear-gradient(135deg, #161c2e 0 22px, #1b2238 22px 44px);
      display: grid; place-items: center; text-align: center;
    }
    .shot span {
      font-family: "Archivo", "Helvetica Neue", sans-serif;
      font-size: 26px; font-weight: 900; letter-spacing: .14em; color: rgba(255,255,255,.58);
      padding: 0 20px; line-height: 1.5;
    }
  </style>
</helmet>

<!-- LAYOUT 3 — CHALLENGE. One enormous number or stake, centred, with the
     screenshot pushed behind it. This is the layout that survives the
     smallest, because at 120px wide a two-character number is still a
     two-character number when a sentence has become grey mush. -->
<div class="support" style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0e17;">
  <div class="shot" style="position: absolute; inset: 0; border: none; border-radius: 0; opacity: .5;; place-items: start end; padding: 38px 54px"><span style="font-size: 30px;">FULL-BLEED SCREENSHOT BEHIND</span></div>
  <div style="position: absolute; inset: 0; background:
    radial-gradient(900px 620px at 50% 50%, rgba(11,14,23,.55), rgba(11,14,23,.9) 72%);"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
    <div class="display punch" style="font-size: 260px; line-height: .82; color: {{accent}};">24</div>
    <div class="display punch" style="font-size: 92px; line-height: .92;">HOUR BUILD</div>
    <div style="margin-top: 18px; padding: 12px 34px; border-radius: 999px; background: #ff3d9a;
         box-shadow: 0 0 0 7px #05070d;">
      <span class="support" style="font-size: 30px; font-weight: 900; letter-spacing: .16em; color: #ffffff;">IT BROKE</span>
    </div>
  </div>
  <sc-if value="{{showGuides}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <!-- YouTube paints the duration chip over this corner on every
           thumbnail. Anything put here is covered up. -->
      <div style="position: absolute; right: 22px; bottom: 22px; width: 150px; height: 54px;
                  border: 3px dashed #ff3d9a; border-radius: 8px; display: grid; place-items: center;">
        <span class="support" style="font-size: 15px; font-weight: 900; letter-spacing: .1em; color: #ff3d9a;">DURATION</span>
      </div>
      <div style="position: absolute; inset: 32px; border: 2px dashed rgba(53,224,255,.55);"></div>
      <div class="support" style="position: absolute; left: 36px; top: 8px; font-size: 15px; font-weight: 900; letter-spacing: .1em; color: rgba(53,224,255,.8);">SAFE MARGIN</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#b6ff3a", "options": ["#b6ff3a", "#ffd21e", "#ff2d2d", "#35e0ff"], "section": "Look"},
  "showGuides": {"editor": "boolean", "default": true, "section": "Look"},
  "$preview": {"width": 1280, "height": 720}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#b6ff3a',
      showGuides: this.props.showGuides ?? true,
    };
  }
}
</script>
</body>
</html>
